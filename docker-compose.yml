services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tenderiq
      POSTGRES_USER: tenderiq
      POSTGRES_PASSWORD: tenderiq_dev
    ports:
      - "5432:5432"
    volumes:
      - tenderiq_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tenderiq -d tenderiq"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tenderiq_postgres_data:

